name: Diagnose ARM batch safety
# Diagnostic revision: raw-byte comparison, debug symbols.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/batch-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build native test harness
        run: ./scripts/test-macos.sh
      - name: Debug native batch
        run: |
          python3 - <<'PYCODE'
          import subprocess,os
          from pathlib import Path
          os.environ['COMIC_TRACE_BATCH']='1'
          r=subprocess.run(['lldb','--batch','-o','run','-k','thread backtrace all','--','.build/macos-tests','--benchmark-batch'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=150)
          Path('.build/batch-backtrace.log').write_text(r.stdout)
          lines=r.stdout.splitlines()
          starts=[i for i,line in enumerate(lines) if 'frame #0' in line or 'frame #10' in line or 'frame #20' in line]
          for i in starts[:12]:
              chunk='\n'.join(lines[max(0,i-1):i+15])[:3500].replace('%','%25').replace('\n','%0A')
              print(f'::notice title=Batch debugger stack::{chunk}')
          for line in lines:
              if '[Batch]' in line or '[Pipeline]' in line:
                  print(f'::notice title=Batch trace::{line}')
          PYCODE
      - name: Build Swift-C AddressSanitizer harness
        run: COMIC_SANITIZE=1 ./scripts/test-macos.sh
      - name: Sanitized batch
        run: |
          set +e
          COMIC_TRACE_BATCH=1 .build/macos-tests --benchmark-batch > .build/batch-sanitizer.log 2>&1
          status=$?
          python3 - <<'PYCODE'
          from pathlib import Path
          lines=Path('.build/batch-sanitizer.log').read_text().splitlines()
          indexes=[i for i,l in enumerate(lines) if 'ERROR:' in l or 'SUMMARY:' in l or 'frame #0' in l or 'Sanitizer' in l]
          for i in indexes[:6]:
              chunk='\n'.join(lines[max(0,i-1):i+25])[:3500].replace('%','%25').replace('\n','%0A')
              print(f'::error title=Batch sanitizer::{chunk}')
          PYCODE
          exit "$status"
