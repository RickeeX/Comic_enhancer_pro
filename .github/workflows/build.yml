name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-core.sh
      - name: Address and undefined behavior sanitizers
        run: |
          c++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -I core/include core/src/ComicCore.cpp tests/core_tests.cpp -o /tmp/core-sanitized
          /tmp/core-sanitized
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p .build; ./scripts/test-core.sh 2>&1 | tee .build/core.log
      - name: Representative processing benchmark
        shell: bash
        run: |
          set -o pipefail
          .build/core-tests --benchmark | tee .build/benchmark.log
          { echo '### CPU processing benchmark'; echo '```text'; cat .build/benchmark.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 30 MP performance comparison with v0.4.1
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin tag v0.4.1
          mkdir -p .build/baseline
          git archive v0.4.1 core | tar -x -C .build/baseline
          c++ -std=c++17 -O3 -DNDEBUG -pthread -I core/include .build/baseline/core/src/ComicCore.cpp tests/performance.cpp -framework Accelerate -o .build/perf-before
          c++ -std=c++17 -O3 -DNDEBUG -pthread -I core/include core/src/ComicCore.cpp tests/performance.cpp -framework Accelerate -o .build/perf-after
          .build/perf-before | tee .build/performance-before.log
          .build/perf-after | tee .build/performance-after.log
          { echo '### 30 MP core, v0.4.1 then current (same runner, O3)'; echo '```text'; cat .build/performance-before.log .build/performance-after.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYCODE'
          from pathlib import Path
          def timings(name):
              return {line.split(': ')[0]: float(line.split(': ')[1].split()[0])
                      for line in Path(name).read_text().splitlines() if ': ' in line}
          before = timings('.build/performance-before.log')
          after = timings('.build/performance-after.log')
          report = '; '.join(f'{name}: {before[name]:.0f} -> {value:.0f} ms ({before[name]/value:.2f}x)'
                             for name, value in after.items())
          print(f'::notice title=30 MP core comparison::{report}')
          PYCODE
      - name: Native codec integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .build
          ./scripts/test-macos.sh 2>&1 | tee .build/integration.log
      - name: 30 MP native pipeline benchmark
        shell: bash
        run: |
          set -euo pipefail
          .build/macos-tests --benchmark | tee .build/native-performance.log
          { echo '### Native decode, processing and export'; echo '```text'; cat .build/native-performance.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('.build/native-performance.log').read_text().splitlines():
              print(f'::notice title=30 MP native pipeline::{line}')
          PYCODE
      - name: Evaluate Gray8 Accelerate and Metal
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/benchmark-acceleration.sh 2>&1 | tee .build/acceleration.log
          python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('.build/acceleration.log').read_text().splitlines():
              if line.startswith('17.78 MP ') or line.startswith('Metal evaluation:'):
                  print(f'::notice title=Mac acceleration evaluation::{line}')
          PYCODE
      - name: Compare complete native stack with v0.4.2
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/benchmark-native-comparison.sh 2>&1 | tee .build/native-comparison.log
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          fingerprints=[]
          for variant in ['before','after']:
              for line in Path(f'.build/native-{variant}-comparison.log').read_text().splitlines():
                  print(f'::notice title=Native stack {variant} v0.4.2::{line}')
                  if line.startswith('Native pixel fingerprint: '):
                      fingerprints.append(line.split(': ')[1])
          assert len(fingerprints)==2 and fingerprints[0]==fingerprints[1], 'Native full stack changed output pixels'

          PYCODE
      - name: Compare bounded batch modes
        shell: bash
        run: |
          set -euo pipefail
          set +e
          COMIC_TRACE_BATCH=1 .build/macos-tests --benchmark-batch 2>&1 | tee .build/batch-performance.log
          batch_status=${PIPESTATUS[0]}
          echo "$batch_status" > .build/batch-exit.txt
          if [[ "$batch_status" != 0 ]]; then cp .build/macos-tests .build/macos-tests.native; exit "$batch_status"; fi
          set -e
          python3 - <<'PYCODE'
          from pathlib import Path
          for line in Path('.build/batch-performance.log').read_text().splitlines():
              print(f'::notice title=Bounded batch comparison::{line}')
          PYCODE
      - name: Swift and C buffer lifetime stress
        if: ${{ !cancelled() && matrix.os == 'macos-15' }}
        shell: bash
        run: |
          set -euo pipefail
          COMIC_SANITIZE=1 ./scripts/test-macos.sh 2>&1 | tee .build/swift-asan.log
          COMIC_TRACE_BATCH=1 .build/macos-tests --benchmark-batch 2>&1 | tee .build/batch-asan.log
      - name: Universal app build
        shell: bash
        run: |
          set -o pipefail
          ./scripts/build-macos.sh 2>&1 | tee .build/application.log
      - name: Native batch crash backtrace
        if: failure()
        shell: bash
        run: |
          if [[ -f .build/batch-exit.txt ]] && [[ "$(cat .build/batch-exit.txt)" != 0 ]]; then
            python3 - <<'PYCODE'
          import subprocess,os
          os.environ['COMIC_TRACE_BATCH']='1'
          from pathlib import Path
          try:
              result=subprocess.run(['lldb','--batch','-o','run','-k','thread backtrace all','--','.build/macos-tests.native','--benchmark-batch'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=150)
              Path('.build/batch-backtrace.log').write_text(result.stdout)
              lines=result.stdout.splitlines()
              positions=[i for i,line in enumerate(lines) if 'stop reason' in line or 'frame #0' in line or 'frame #10' in line or 'frame #20' in line]
              for i in positions[:12]:
                  chunk='\n'.join(lines[max(0,i-1):i+20])[:3000].replace('%','%25').replace('\n','%0A')
                  print(f'::error title=Native batch crash::{chunk}')
          except subprocess.TimeoutExpired:
              print('::error::Batch crash debugger exceeded 150 seconds')
          PYCODE
          fi
      - name: Surface compiler diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for log in Path('.build').glob('*.log'):
              if log.name == 'benchmark.log' or ('performance' in log.name and 'batch' not in log.name):
                  continue
              lines = log.read_text().splitlines()
              positions = [i for i, line in enumerate(lines) if 'error:' in line.lower() or 'fatal error' in line.lower() or 'assertion failed' in line.lower()]
              chunks = ['\n'.join(lines[max(0, i-1):i+(24 if 'AddressSanitizer' in lines[i] else 4)]) for i in positions[:16]]
              if not chunks:
                  chunks = ['\n'.join(lines[-30:])]
              for index, text in enumerate(chunks):
                  text = text[:2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error title={log.name} diagnostic {index+1}::{text}')
          PYCODE
      - name: Archive universal application
        run: ditto -c -k --sequesterRsrc --keepParent '.build/Comic Enhancer.app' '.build/ComicEnhancer-macOS-universal.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ComicEnhancer-universal-${{ matrix.os }}
          path: .build/ComicEnhancer-macOS-universal.zip
          if-no-files-found: error
  release:
    name: Publish universal macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ComicEnhancer-universal-macos-15
          path: dist
      - name: Verify archive and generate checksum
        working-directory: dist
        run: |
          python3 - <<'PYCODE'
          from zipfile import ZipFile
          with ZipFile('ComicEnhancer-macOS-universal.zip') as archive:
              assert archive.testzip() is None, 'Corrupt ZIP archive'
              executable = archive.read('Comic Enhancer.app/Contents/MacOS/ComicEnhancer')
              assert len(executable) > 0, 'Missing application executable'
              assert executable[:4] in [bytes.fromhex('cafebabe'), bytes.fromhex('cafebabf')], 'Expected a universal Mach-O executable'
              assert 'Comic Enhancer.app/Contents/Info.plist' in archive.namelist()
          PYCODE
          sha256sum ComicEnhancer-macOS-universal.zip > SHA256SUMS.txt
      - name: Publish release with application download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/ComicEnhancer-macOS-universal.zip dist/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "Comic Enhancer $GITHUB_REF_NAME · macOS Intel / Apple Silicon" \
            --notes-file docs/release-notes.md
